version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: v2x-mqtt-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./deployment/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  cloud-api:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    container_name: v2x-cloud-api
    ports:
      - "8000:8000"
    depends_on:
      - mosquitto
    environment:
      - MQTT_HOST=mosquitto
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - ./logs:/app/logs
    restart: unless-stopped
